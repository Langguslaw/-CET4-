<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>CET4小助手[安德塔构律大师出品]</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#16211f;
  --panel:#1e2b28;
  --panel-2:#233530;
  --ink:#e8e1d0;
  --ink-dim:#8f978d;
  --accent:#c96a35;
  --accent-dim:#7a4527;
  --accent-2:#8a9c62;
  --line:#34423d;
  --danger:#a8453c;
  --good:#7a9d5c;
}
*{box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'IBM Plex Mono',monospace;
  margin:0;
  padding:24px 20px 40px;
  min-height:100vh;
}
.wrap{max-width:720px;margin:0 auto;}

.masthead{
  border-bottom:1px solid var(--line);
  padding-bottom:16px;
  margin-bottom:20px;
}
.masthead .kicker{
  font-size:11px;
  letter-spacing:.14em;
  color:var(--accent);
  text-transform:uppercase;
}
.masthead h1{
  font-family:'Zilla Slab',serif;
  font-weight:700;
  font-size:28px;
  margin:4px 0 6px;
  color:var(--ink);
}
.masthead .sub{
  font-size:12px;
  color:var(--ink-dim);
  line-height:1.6;
}

.tabs{
  display:flex;
  gap:2px;
  margin-bottom:20px;
}
.tab{
  flex:1;
  background:var(--panel);
  border:1px solid var(--line);
  border-bottom:none;
  color:var(--ink-dim);
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  letter-spacing:.04em;
  padding:10px 8px;
  cursor:pointer;
  text-align:center;
  transition:background .15s, color .15s;
}
.tab.active{
  background:var(--panel-2);
  color:var(--accent);
  font-weight:600;
}
.tab:hover:not(.active){color:var(--ink);}

.panel{
  background:var(--panel-2);
  border:1px solid var(--line);
  padding:20px;
  min-height:320px;
}
.hidden{display:none;}

label{
  display:block;
  font-size:11px;
  color:var(--ink-dim);
  letter-spacing:.06em;
  text-transform:uppercase;
  margin-bottom:6px;
}
textarea, input[type=text]{
  width:100%;
  background:var(--bg);
  border:1px solid var(--line);
  color:var(--ink);
  font-family:'IBM Plex Mono',monospace;
  font-size:14px;
  padding:10px 12px;
  resize:vertical;
}
textarea:focus, input[type=text]:focus{
  outline:none;
  border-color:var(--accent-dim);
}
.field{margin-bottom:14px;}
.row2{display:flex;gap:12px;}
.row2 > div{flex:1;}

button{
  background:transparent;
  border:1px solid var(--accent-dim);
  color:var(--accent);
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  letter-spacing:.05em;
  padding:9px 16px;
  cursor:pointer;
  transition:background .15s, color .15s;
}
button:hover{background:var(--accent-dim);color:var(--ink);}
button.primary{
  background:var(--accent-dim);
  color:var(--ink);
}
button.primary:hover{background:var(--accent);}
button.ghost{border-color:var(--line);color:var(--ink-dim);}
button.ghost:hover{background:var(--panel);color:var(--ink);}
button:disabled{opacity:.35;cursor:not-allowed;}
button:disabled:hover{background:transparent;color:var(--accent);}

.hint{font-size:11px;color:var(--ink-dim);margin-top:4px;line-height:1.6;}

.type-toggle{display:flex;gap:8px;margin-bottom:14px;}
.type-toggle button{flex:1;}
.type-toggle button.selected{background:var(--accent-dim);color:var(--ink);}

.entry-list{display:flex;flex-direction:column;gap:10px;margin-top:8px;}
.entry-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-left:3px solid var(--accent-dim);
  padding:12px 14px;
  position:relative;
}
.entry-card.box0{border-left-color:var(--line);}
.entry-card.box1{border-left-color:var(--accent-dim);}
.entry-card.box2, .entry-card.box3{border-left-color:var(--accent);}
.entry-card.box4{border-left-color:var(--accent-2);}
.entry-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.entry-text{font-size:14px;color:var(--ink);line-height:1.5;}
.speak-btn{
  background:transparent;
  border:1px solid var(--line);
  color:var(--accent-2);
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  padding:4px 9px;
  cursor:pointer;
  flex-shrink:0;
}
.speak-btn:hover{border-color:var(--accent-2);background:var(--panel);}
.speak-btn:disabled{opacity:.3;cursor:not-allowed;}
.quiz-word-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:20px;}
.quiz-word-row .quiz-word{margin-bottom:0;}
.entry-note{font-size:12px;color:var(--ink-dim);margin-top:4px;}
.entry-meta{display:flex;align-items:center;gap:8px;margin-top:8px;}
.stage-pill{
  font-size:10px;
  letter-spacing:.05em;
  color:var(--ink-dim);
  border:1px solid var(--line);
  padding:2px 8px;
  text-transform:uppercase;
}
.entry-actions{display:flex;gap:6px;}
.entry-actions button{padding:4px 8px;font-size:11px;}
.empty-state{
  text-align:center;
  padding:40px 10px;
  color:var(--ink-dim);
  font-size:13px;
  line-height:1.8;
}
.empty-state .glyph{font-size:22px;color:var(--accent-dim);display:block;margin-bottom:10px;}

.quiz-source{display:flex;gap:8px;margin-bottom:18px;}
.quiz-source button{flex:1;}
.quiz-source button.selected{background:var(--accent-dim);color:var(--ink);}

.quiz-stage{
  border:1px solid var(--line);
  background:var(--panel);
  padding:24px 20px;
  text-align:center;
}
.quiz-progress{font-size:11px;color:var(--ink-dim);letter-spacing:.05em;margin-bottom:14px;}
.quiz-word{
  font-family:'Zilla Slab',serif;
  font-size:26px;
  font-weight:600;
  color:var(--ink);
  margin-bottom:20px;
  line-height:1.4;
}
.quiz-options{display:flex;flex-direction:column;gap:8px;}
.quiz-opt{
  background:var(--bg);
  border:1px solid var(--line);
  color:var(--ink);
  padding:11px 14px;
  font-size:13px;
  text-align:left;
  cursor:pointer;
}
.quiz-opt:hover{border-color:var(--accent-dim);}
.quiz-opt.correct{border-color:var(--good);background:#1e2b23;color:var(--good);}
.quiz-opt.wrong{border-color:var(--danger);background:#2b201e;color:#d18178;}
.quiz-opt.disabled{cursor:default;}
.quiz-footer{display:flex;justify-content:space-between;align-items:center;margin-top:18px;}
.quiz-score{font-size:11px;color:var(--ink-dim);}

.flash-card{
  border:1px solid var(--line);
  background:var(--panel);
  padding:28px 20px;
  text-align:center;
  cursor:pointer;
  min-height:140px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.flash-front{font-size:15px;line-height:1.7;color:var(--ink);}
.flash-back{font-size:13px;line-height:1.7;color:var(--accent-2);}
.flash-hint{font-size:11px;color:var(--ink-dim);margin-top:16px;}
.flash-controls{display:flex;justify-content:center;gap:10px;margin-top:16px;}

.stat-row{display:flex;gap:10px;margin-bottom:18px;}
.stat{
  flex:1;
  background:var(--panel);
  border:1px solid var(--line);
  padding:12px;
  text-align:center;
}
.stat .num{font-family:'Zilla Slab',serif;font-size:22px;color:var(--accent);}
.stat .lbl{font-size:10px;color:var(--ink-dim);letter-spacing:.05em;text-transform:uppercase;margin-top:4px;}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:var(--panel-2);
  border:1px solid var(--accent-dim);
  color:var(--ink);
  padding:10px 18px;
  font-size:12px;
  opacity:0;
  transition:opacity .25s;
  pointer-events:none;
}
.toast.show{opacity:1;}

/* ------ 错题库样式 ------ */
.mistake-item {
  background:var(--panel);
  border:1px solid var(--line);
  border-left:3px solid var(--danger);
  padding:12px 14px;
  margin-bottom:10px;
}
.mistake-item .word {
  font-size:15px;
  font-weight:600;
  color:var(--ink);
}
.mistake-item .meaning {
  font-size:13px;
  color:var(--ink-dim);
  margin-top:2px;
}
.mistake-item .meta {
  font-size:11px;
  color:var(--ink-dim);
  margin-top:6px;
  display:flex;
  gap:12px;
}
.mistake-item .meta .badge {
  color:var(--danger);
  border:1px solid var(--danger);
  padding:0 8px;
  border-radius:2px;
}
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div class="kicker">CET4学习·并非可视化</div>
    <h1>?!CET4?!</h1>
    <div class="sub">莫名其妙记一些词或者句子，当然，也可以随时抽查CET4词库。</div>
    <div style="margin-top:10px;display:flex;gap:8px;">
      <button class="ghost" id="btn-export" style="padding:4px 12px;font-size:11px;">⬇ 备份到文件</button>
      <button class="ghost" id="btn-import" style="padding:4px 12px;font-size:11px;">⬆ 从文件恢复</button>
      <input type="file" id="file-import" accept="application/json" style="display:none;">
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="capture">速记</div>
    <div class="tab" data-tab="notebook">独立库</div>
    <div class="tab" data-tab="quiz">抽查</div>
    <div class="tab" data-tab="mistakes">错题库</div>
  </div>

  <div class="panel" id="panel-capture">
    <div class="type-toggle">
      <button id="type-word" class="selected">单词</button>
      <button id="type-sentence">句子</button>
    </div>
    <div class="field">
      <label id="text-label">原文 (英文)</label>
      <textarea id="input-text" rows="2" placeholder="比如: encyclopedic, 或整句台词"></textarea>
      <button class="speak-btn" id="capture-speak" style="margin-top:6px;" title="朗读">&#9835; 朗读</button>
    </div>
    <div class="field">
      <label>释义 / 备注(选填,但填了才能被抽查到)</label>
      <input type="text" id="input-note" placeholder="中文释义或你的理解">
    </div>
    <div class="row2">
      <button class="primary" id="btn-save" style="flex:1">存入独立库</button>
      <button class="ghost" id="btn-clear" style="flex:1">清空</button>
    </div>
    <div class="hint" id="save-hint"></div>
  </div>

  <div class="panel hidden" id="panel-notebook">
    <div class="stat-row" id="notebook-stats"></div>
    <div id="notebook-list"></div>
  </div>

  <div class="panel hidden" id="panel-quiz">
    <div class="quiz-source">
      <button id="src-cet4" class="selected">CET4词库</button>
      <button id="src-mine">我的独立库</button>
    </div>
    <div id="quiz-area"></div>
  </div>

  <!-- 错题库面板 -->
  <div class="panel hidden" id="panel-mistakes">
    <div style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:12px;color:var(--ink-dim);">答错时自动收录，可手动清空</span>
      <button class="ghost" id="clear-mistakes" style="padding:4px 12px;font-size:11px;">清空错题</button>
    </div>
    <div id="mistake-list"></div>
  </div>

</div>
<div class="toast" id="toast"></div>

let entries = [];
let quizState = null;
let flashState = null;

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

function speak(text){
  if(!('speechSynthesis' in window)){
    toast('这个浏览器不支持朗读');
    return;
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.92;
  window.speechSynthesis.speak(u);
}

async function loadEntries(){
  try{
    const raw = localStorage.getItem('cet4_entries');
    entries = raw ? JSON.parse(raw) : [];
  }catch(e){
    entries = [];
  }
}
async function saveEntries(){
  try{
    localStorage.setItem('cet4_entries', JSON.stringify(entries));
  }catch(e){
    console.error('save failed', e);
    toast('保存失败，可能是浏览器存储空间已满');
  }
}

let entryType = 'word';
document.getElementById('type-word').onclick = ()=>{
  entryType='word';
  document.getElementById('type-word').classList.add('selected');
  document.getElementById('type-sentence').classList.remove('selected');
  document.getElementById('text-label').textContent='原文 (英文单词)';
  document.getElementById('input-text').placeholder='比如: encyclopedic';
};
document.getElementById('type-sentence').onclick = ()=>{
  entryType='sentence';
  document.getElementById('type-sentence').classList.add('selected');
  document.getElementById('type-word').classList.remove('selected');
  document.getElementById('text-label').textContent='原文 (英文句子)';
  document.getElementById('input-text').placeholder='比如整句台词';
};

document.getElementById('capture-speak').onclick = ()=>{
  const text = document.getElementById('input-text').value.trim();
  if(text) speak(text); else toast('先输入点内容');
};

document.getElementById('btn-clear').onclick = ()=>{
  document.getElementById('input-text').value='';
  document.getElementById('input-note').value='';
};

document.getElementById('btn-save').onclick = async ()=>{
  const text = document.getElementById('input-text').value.trim();
  const note = document.getElementById('input-note').value.trim();
  const hint = document.getElementById('save-hint');
  if(!text){
    hint.textContent = '先填一点原文再存入吧。';
    hint.style.color = 'var(--danger)';
    return;
  }
  entries.unshift({
    id: uid(),
    type: entryType,
    text, note,
    box: 0,
    createdAt: Date.now()
  });
  await saveEntries();
  document.getElementById('input-text').value='';
  document.getElementById('input-note').value='';
  hint.textContent = '已存入库中。';
  hint.style.color = 'var(--good)';
  toast('已归档');
  speak(text);
  renderNotebook();
};

function stageLabel(box){
  if(box<=0) return '未归档';
  if(box<=2) return '潜伏中';
  if(box===3) return '内化中';
  return '已内化';
}

function renderNotebook(){
  const list = document.getElementById('notebook-list');
  const stats = document.getElementById('notebook-stats');
  const words = entries.filter(e=>e.type==='word').length;
  const sentences = entries.filter(e=>e.type==='sentence').length;
  const internalized = entries.filter(e=>e.box>=4).length;
  stats.innerHTML = `
    <div class="stat"><div class="num">${entries.length}</div><div class="lbl">总计</div></div>
    <div class="stat"><div class="num">${words}</div><div class="lbl">单词</div></div>
    <div class="stat"><div class="num">${sentences}</div><div class="lbl">句子</div></div>
    <div class="stat"><div class="num">${internalized}</div><div class="lbl">已内化</div></div>
  `;
  if(entries.length===0){
    list.innerHTML = `<div class="empty-state"><span class="glyph">卷宗为空</span>去"速记"页存一些句子和单词进来吧。</div>`;
    return;
  }
  list.innerHTML = '<div class="entry-list">' + entries.map(e=>`
    <div class="entry-card box${Math.min(e.box,4)}" data-id="${e.id}">
      <div class="entry-top">
        <div style="flex:1">
          <div class="entry-text">${escapeHtml(e.text)}</div>
          ${e.note ? `<div class="entry-note">${escapeHtml(e.note)}</div>` : ''}
        </div>
        <button class="speak-btn" data-speak="${escapeHtml(e.text)}" title="朗读">&#9835;</button>
      </div>
      <div class="entry-meta">
        <span class="stage-pill">${e.type==='word'?'单词':'句子'}</span>
        <span class="stage-pill">${stageLabel(e.box)}</span>
        <div style="flex:1"></div>
        <div class="entry-actions">
          <button class="ghost del-btn" data-id="${e.id}">删除</button>
        </div>
      </div>
    </div>
  `).join('') + '</div>';

  list.querySelectorAll('.speak-btn').forEach(btn=>{
    btn.onclick = ()=>speak(btn.getAttribute('data-speak'));
  });

  list.querySelectorAll('.del-btn').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.getAttribute('data-id');
      entries = entries.filter(e=>e.id!==id);
      await saveEntries();
      renderNotebook();
      toast('已移除');
    };
  });
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let quizScore = {correct:0, total:0};

function pickDistractors(pool, correctIdx, count){
  const idxs = new Set([correctIdx]);
  while(idxs.size < Math.min(count+1, pool.length)){
    idxs.add(Math.floor(Math.random()*pool.length));
  }
  return Array.from(idxs);
}

function startQuizRound(){
  const area = document.getElementById('quiz-area');

  if(quizSource==='cet4'){
    renderWordQuiz(CET4, (w)=>w.word, (w)=>w.meaning);
    return;
  }

  const myWords = entries.filter(e=>e.type==='word' && e.note);
  if(myWords.length < 4){
    area.innerHTML = `<div class="empty-state"><span class="glyph">存货不够</span>我的独立库里带释义的单词不足4个,先去"速记"多存几个吧(句子也可以用下方的翻卡模式复习)。</div>`;
    return;
  }
  renderWordQuiz(myWords, (w)=>w.text, (w)=>w.note);
}

function renderWordQuiz(pool, getWord, getMeaning){
  const area = document.getElementById('quiz-area');
  const correctIdx = Math.floor(Math.random()*pool.length);
  const optionIdxs = pickDistractors(pool, correctIdx, 3);
  optionIdxs.sort(()=>Math.random()-0.5);
  const correctItem = pool[correctIdx];

  area.innerHTML = `
    <div class="quiz-stage">
      <div class="quiz-progress">本轮 ${quizScore.total+1}题 &middot; 正确 ${quizScore.correct}/${quizScore.total}</div>
      <div class="quiz-word-row">
        <div class="quiz-word">${escapeHtml(getWord(correctItem))}</div>
        <button class="speak-btn" id="quiz-speak" title="朗读">&#9835;</button>
      </div>
      <div class="quiz-options">
        ${optionIdxs.map(i=>`<div class="quiz-opt" data-correct="${i===correctIdx}" data-idx="${i}">${escapeHtml(getMeaning(pool[i]))}</div>`).join('')}
      </div>
      <div class="quiz-footer">
        <span class="quiz-score">来源: ${quizSource==='cet4' ? 'CET4核心词库' : '我的独立库'}</span>
        <button id="quiz-next" disabled>下一题</button>
      </div>
    </div>
  `;

  document.getElementById('quiz-speak').onclick = ()=>speak(getWord(correctItem));
  speak(getWord(correctItem));

  const opts = area.querySelectorAll('.quiz-opt');
  let answered = false;
  opts.forEach(opt=>{
    opt.onclick = async ()=>{
      if(answered) return;
      answered = true;
      const isCorrect = opt.getAttribute('data-correct')==='true';
      opts.forEach(o=>o.classList.add('disabled'));
      if(isCorrect){
        opt.classList.add('correct');
        quizScore.correct++;
      }else{
        opt.classList.add('wrong');
        opts.forEach(o=>{if(o.getAttribute('data-correct')==='true') o.classList.add('correct');});
      }
      quizScore.total++;

      // 答错时记录（兼容两种格式）
      if(!isCorrect){
        addMistake(correctItem, quizSource==='cet4' ? 'CET4词库' : '我的独立库');
      }

      if(quizSource==='mine'){
        const idInPool = correctItem.id;
        const target = entries.find(e=>e.id===idInPool);
        if(target){
          target.box = isCorrect ? Math.min((target.box||0)+1, 4) : 0;
          await saveEntries();
        }
      }

      document.getElementById('quiz-next').disabled = false;
    };
  });

  document.getElementById('quiz-next').onclick = ()=>startQuizRound();
}

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.getAttribute('data-tab')===name));
  document.getElementById('panel-capture').classList.toggle('hidden', name!=='capture');
  document.getElementById('panel-notebook').classList.toggle('hidden', name!=='notebook');
  document.getElementById('panel-quiz').classList.toggle('hidden', name!=='quiz');
  document.getElementById('panel-mistakes').classList.toggle('hidden', name!=='mistakes');
  if(name==='notebook') renderNotebook();
  if(name==='quiz'){ quizScore={correct:0,total:0}; startQuizRound(); }
  if(name==='mistakes') renderMistakes();
}
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick = ()=>switchTab(t.getAttribute('data-tab'));
});

(async function init(){
  await loadEntries();
  renderNotebook();
  renderMistakes();
})();


// ===== 错题库（修复版） =====
let mistakes = JSON.parse(localStorage.getItem('mistakes')||'[]');
function saveMistakes(){localStorage.setItem('mistakes',JSON.stringify(mistakes));}

// 兼容 CET4 ({word, meaning}) 和 内阁 ({text, note})
function addMistake(item, source){
  let word, meaning;
  if (item.word !== undefined) {
    word = item.word;
    meaning = item.meaning || '';
  } else if (item.text !== undefined) {
    word = item.text;
    meaning = item.note || '';
  } else {
    return;
  }
  let old = mistakes.find(x => x.word === word);
  if (old) {
    old.wrongCount++;
    old.lastWrong = new Date().toLocaleDateString();
  } else {
    mistakes.push({
      word,
      meaning,
      pos: '',
      source: source || '未知',
      wrongCount: 1,
      lastWrong: new Date().toLocaleDateString()
    });
  }
  saveMistakes();
}

function renderMistakes(){
  const el = document.getElementById('mistake-list');
  if (!el) return;
  if (mistakes.length === 0) {
    el.innerHTML = `<div class="empty-state"><span class="glyph">📭</span>暂无错题，去「抽查」里答错几个试试吧。</div>`;
    return;
  }
  const sorted = [...mistakes].sort((a,b) => b.wrongCount - a.wrongCount);
  el.innerHTML = sorted.map(m => `
    <div class="mistake-item">
      <div class="word">${escapeHtml(m.word)}</div>
      <div class="meaning">${escapeHtml(m.meaning)}</div>
      <div class="meta">
        <span>来源：${escapeHtml(m.source)}</span>
        <span>错误 <span class="badge">${m.wrongCount}次</span></span>
        <span>最近：${m.lastWrong || '--'}</span>
      </div>
    </div>
  `).join('');
}

// 清空错题
document.getElementById('clear-mistakes')?.addEventListener('click', ()=>{
  if (confirm('确定要清空所有错题记录吗？')) {
    mistakes = [];
    saveMistakes();
    renderMistakes();
    toast('错题库已清空');
  }
});

// 重新绑定tab以确保切换时刷新错题库
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick = ()=>switchTab(t.getAttribute('data-tab'));
});

// ===== 备份 / 恢复到本地文件 =====
// localStorage 保存在浏览器里，换浏览器/换电脑/清理浏览器数据都会丢失，
// 所以额外提供导出成真实文件的方式，才是真正意义上"保存在本地"。
document.getElementById('btn-export')?.addEventListener('click', ()=>{
  const backup = {
    exportedAt: new Date().toISOString(),
    entries,
    mistakes
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const ts = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `cet4-backup-${ts}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('已导出备份文件');
});

document.getElementById('btn-import')?.addEventListener('click', ()=>{
  document.getElementById('file-import').click();
});

document.getElementById('file-import')?.addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const data = JSON.parse(reader.result);
      const incomingEntries = Array.isArray(data.entries) ? data.entries : [];
      const incomingMistakes = Array.isArray(data.mistakes) ? data.mistakes : [];
      if(!confirm(`备份文件包含 ${incomingEntries.length} 条独立库记录、${incomingMistakes.length} 条错题记录。\n恢复将覆盖当前数据，确定继续吗？`)) return;
      entries = incomingEntries;
      mistakes = incomingMistakes;
      await saveEntries();
      saveMistakes();
      renderNotebook();
      renderMistakes();
      toast('恢复成功');
    }catch(err){
      toast('文件格式不对，恢复失败');
    }finally{
      e.target.value = '';
    }
  };
  reader.readAsText(file);
});
</script>
